<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horario · Máster PLN 2026-2027</title>
<style>
  :root{
    --paper:#eef1f6;
    --ink:#1a2238;
    --ink-soft:#4a5170;
    --line:#c9cfdd;
    --tab-inactive:#dde2ee;
    --accent-s1:#2f6f6a;
    --accent-s2:#b5556b;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Iowan Old Style","Georgia",serif;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:36px 20px 60px;}
  .headerrow{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
  }
  h1{
    font-size:26px;
    letter-spacing:.01em;
    margin:0 0 2px;
    font-weight:600;
  }
  .subtitle{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--ink-soft);
    font-size:13.5px;
    margin:0 0 26px;
  }

  /* --- tz switch --- */
  .tzswitch{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    background:#fff;
    border:1px solid var(--line);
    border-radius:20px;
    padding:3px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }
  .tzswitch button{
    border:none;
    background:transparent;
    cursor:pointer;
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    letter-spacing:.02em;
    padding:7px 14px;
    border-radius:16px;
    color:var(--ink-soft);
    transition:background .15s, color .15s;
  }
  .tzswitch button.active{
    background:var(--ink);
    color:#fff;
  }

  /* --- folder tabs --- */
  .tabbar{
    display:flex;
    align-items:flex-end;
    gap:4px;
    overflow-x:auto;
    padding-bottom:0;
    scrollbar-width:thin;
  }
  .tab{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    flex:0 0 auto;
    cursor:pointer;
    background:var(--tab-inactive);
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    padding:9px 16px 8px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.02em;
    position:relative;
    top:1px;
    transition:background .15s, color .15s;
    white-space:nowrap;
    text-transform:capitalize;
  }
  .tab.active{
    background:var(--card);
    color:var(--ink);
    border-color:var(--line);
  }
  .tab.active.s1{ box-shadow: inset 0 3px 0 var(--accent-s1); }
  .tab.active.s2{ box-shadow: inset 0 3px 0 var(--accent-s2); }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:0 8px 8px 8px;
    padding:22px 22px 8px;
  }
  .empty{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--ink-soft);
    font-size:14px;
    padding:50px 10px 60px;
    text-align:center;
    font-style:normal;
  }

  /* --- grid --- */
  .grid-outer{position:relative;}
  .daynames{
    display:flex;
    margin-left:56px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .daynames span{flex:1;text-align:center;padding-bottom:4px;border-bottom:1px solid var(--line);}

  .grid{
    position:relative;
    margin-left:56px;
    background-image:repeating-linear-gradient(
      to bottom,
      var(--line) 0px, var(--line) 1px,
      transparent 1px, transparent var(--hourpx)
    );
  }
  .grid-inner{position:relative;}
  .hourlabels{
    position:absolute;
    left:0;
    top:0;
    width:56px;
    transform:translateX(-56px);
  }
  .hourlabel{
    position:absolute;
    left:0;
    width:48px;
    text-align:right;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:10.5px;
    color:var(--ink-soft);
    transform:translateY(-6px);
  }
  .daycol-bg{position:absolute;top:0;bottom:0;border-right:1px solid var(--line);}
  .block{
    position:absolute;
    border-radius:5px;
    padding:4px 6px;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:10.6px;
    line-height:1.28;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.15);
  }
  .block b{display:block;font-size:10.8px;font-weight:700;margin-bottom:2px;}
  .block .dr{display:block;font-size:11.6px;font-weight:800;margin-bottom:2px;letter-spacing:.01em;}
  .block .t{opacity:.92;font-size:9.8px;}

  /* --- legend --- */
  .legend{
    margin:22px 0 18px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  .legend-title{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
    font-weight:700;
    margin:0 0 8px;
  }
  .legend-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:6px 14px;
  }
  .legend-item{
    display:flex;
    align-items:flex-start;
    gap:7px;
    font-size:11.5px;
    color:var(--ink);
  }
  .swatch{width:10px;height:10px;border-radius:3px;margin-top:2px;flex:0 0 auto;}
  .legend-item .name{font-weight:600;}
  .legend-item .meta{display:block;color:var(--ink-soft);font-size:10.3px;}
  .done-tag{
    display:inline-block;margin-left:6px;
    font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink-soft);background:var(--tab-inactive);
    border-radius:8px;padding:1px 7px;vertical-align:middle;
  }

  /* --- cuadro hoy / próxima clase --- */
  .nextbox{
    background:#fff;
    border:1px solid var(--line);
    border-left:4px solid var(--accent-s1);
    border-radius:8px;
    padding:12px 16px;
    margin:0 0 20px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  .nb-title{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink-soft);font-weight:700;margin-bottom:6px;
  }
  .nb-line{font-size:13.5px;margin:3px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .nb-sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto;}
  .nb-live{
    font-size:10.5px;font-weight:700;color:#fff;background:var(--accent-s1);
    border-radius:10px;padding:2px 8px;
  }

  /* --- selector mes/semana + navegación semanal --- */
  .viewrow{margin:0 0 14px;}
  .panel.full{border-radius:8px;}
  .weeknav{
    display:flex;align-items:center;gap:8px;margin-bottom:16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  .weeknav button{
    border:1px solid var(--line);background:#fff;color:var(--ink);
    border-radius:16px;padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .weeknav button:hover:not(:disabled){background:var(--tab-inactive);}
  .weeknav button:disabled{opacity:.35;cursor:default;}
  .wk-label{flex:1;text-align:center;font-weight:700;font-size:13.5px;}
  .daynames small{display:block;font-size:10.5px;font-weight:600;letter-spacing:0;text-transform:none;margin-top:1px;}
  .daynames span.today{color:var(--accent-s1);}

  /* --- días en los que no se cursa + temas --- */
  .block.skipped{
    background:#fff;
    border:2px dashed currentColor;
    box-shadow:none;
    padding:2px 5px;
  }
  .block .st{display:block;font-weight:800;font-size:10.8px;margin-bottom:2px;}
  .block .tm{
    display:inline-block;font-weight:800;font-size:11px;
    background:rgba(255,255,255,.25);border-radius:4px;padding:0 6px;margin-top:9px;margin-bottom:2px;
  }
  .block .ti{display:inline-block;max-width:100%;font-weight:800;font-size:10.8px;line-height:1.25;background:rgba(255,255,255,.25);border-radius:4px;padding:2px 6px;margin:9px 0 4px;}
  .block .de{display:block;font-size:9.8px;opacity:.92;margin-bottom:3px;}
  .block .pt{display:block;font-size:9.6px;opacity:.95;line-height:1.3;}
  .nb-gap{margin-top:12px;}
  .nb-muted{opacity:.6;}
  .nb-skip{
    font-size:10.5px;font-weight:700;color:var(--ink-soft);background:var(--tab-inactive);
    border-radius:10px;padding:2px 8px;
  }

  @media (max-width:640px){
    .panel{padding:16px 10px 8px;}
    .grid, .daynames{margin-left:34px;}
    .hourlabels{width:34px;transform:translateX(-34px);}
    .hourlabel{width:30px;font-size:9px;}
    .block{font-size:9.4px;}
    .block b{font-size:9.6px;}
  }
</style>
</head>

function isFinished(cid){
  const h = new Date();
  const hoyIso = h.getFullYear()+"-"+String(h.getMonth()+1).padStart(2,"0")+"-"+String(h.getDate()).padStart(2,"0");
  return courseEnd[cid] < hoyIso;
}

function isPast(iso){
  const h = new Date();
  const hoyIso = h.getFullYear()+"-"+String(h.getMonth()+1).padStart(2,"0")+"-"+String(h.getDate()).padStart(2,"0");
  return iso < hoyIso;
}

function monthBounds(key){
  const [y,m] = key.split("-").map(Number);
  const start = new Date(y, m-1, 1);
  const end = new Date(y, m, 0);
  return {start,end};
}
function overlaps(sess, mStart, mEnd){
  const f = new Date(sess.f), t = new Date(sess.t);
  return f <= mEnd && t >= mStart;
}
function fmtHour(h){
  const shifted = h - tzOffset;
  const hh = Math.floor(shifted);
  const mm = Math.round((shifted-hh)*60);
  return hh + (mm ? ":"+String(mm).padStart(2,"0") : ":00");
}
function fmtDate(iso){
  const [y,m,d] = iso.split("-");
  return d+"/"+m;
}
const MONTH_ABBR = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmtDateLong(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return parseInt(d)+" "+MONTH_ABBR[m-1];
}

function classInfo(s, date){
  const cd = CLASS_DATES[s.c];
  if(!cd) return {skip:false, tema:"", title:"", detail:""};
  const v = cd[date];
  if(v===undefined) return {skip:true, tema:"", title:"", detail:""};
  if(typeof v==="string") return {skip:false, tema:v, title:"", detail:""};
  return {skip:false, tema:v.tag||"", title:v.title||"", detail:v.detail||""};
}

let viewMode = "month";
try { if(localStorage.getItem("view")==="week") viewMode = "week"; } catch(e){}
let weekStart = null; // lunes (ISO) de la semana que se muestra

function todayIso(){
  const h = new Date();
  return h.getFullYear()+"-"+String(h.getMonth()+1).padStart(2,"0")+"-"+String(h.getDate()).padStart(2,"0");
}
function mondayOf(iso){ return addDaysIso(iso, -dowOfIso(iso)); }
const firstMonday = mondayOf(sessions.reduce((a,s)=>s.f<a?s.f:a, sessions[0].f));
const lastMonday  = mondayOf(sessions.reduce((a,s)=>s.t>a?s.t:a, sessions[0].t));
function defaultWeek(){
  let iso = todayIso();
  const dw = dowOfIso(iso);
  if(dw>=5) iso = addDaysIso(iso, 7-dw); // sábado/domingo → semana siguiente
  let w = mondayOf(iso);
  if(w<firstMonday) w = firstMonday;
  if(w>lastMonday) w = lastMonday;
  return w;
}

function rerender(){
  if(viewMode==="week") renderWeek(); else renderMonth(currentKey);
}

function setTz(offset){
  tzOffset = offset;
  try { localStorage.setItem("tz", offset); } catch(e){}
  document.getElementById("btn-pen").classList.toggle("active", offset===0);
  document.getElementById("btn-can").classList.toggle("active", offset===1);
  renderNext();
  rerender();
}

function setView(mode){
  viewMode = mode;
  try { localStorage.setItem("view", mode); } catch(e){}
  selectedCourse = null;
  document.getElementById("btn-month").classList.toggle("active", mode==="month");
  document.getElementById("btn-week").classList.toggle("active", mode==="week");
  tabbar.style.display = mode==="month" ? "flex" : "none";
  panel.classList.toggle("full", mode==="week");
  if(mode==="week" && !weekStart) weekStart = defaultWeek();
  rerender();
}
document.getElementById("btn-month").addEventListener("click",()=>setView("month"));
document.getElementById("btn-week").addEventListener("click",()=>setView("week"));

function selectMonth(key){
  selectedCourse = null;
  currentKey = key;
  document.querySelectorAll(".tab").forEach(t=>{
    t.classList.toggle("active", t.dataset.key===key);
  });
  renderMonth(key);
}

// Dibuja cabecera de días + cuadrícula + bloques. items = [{s, past}]
function drawGrid(items, labels, todayCol){
  const gridHeight = (HOUR_END - HOUR_START)*HOUR_PX;

  const daynames = document.createElement("div");
  daynames.className = "daynames";
  labels.forEach((l,i)=>{
    const sp = document.createElement("span");
    sp.innerHTML = l;
    if(i===todayCol) sp.className = "today";
    daynames.appendChild(sp);
  });
  panel.appendChild(daynames);

  const gridOuter = document.createElement("div");
  gridOuter.className = "grid-outer";

  const grid = document.createElement("div");
  grid.className = "grid";
  grid.style.setProperty("--hourpx", HOUR_PX+"px");
  grid.style.height = gridHeight+"px";

  const hourlabels = document.createElement("div");
  hourlabels.className = "hourlabels";
  for(let h=HOUR_START; h<=HOUR_END; h++){
    const lab = document.createElement("div");
    lab.className = "hourlabel";
    lab.style.top = ((h-HOUR_START)*HOUR_PX)+"px";
    lab.textContent = (h-tzOffset)+":00";
    hourlabels.appendChild(lab);
  }
  grid.appendChild(hourlabels);

  for(let d=0; d<5; d++){
    const col = document.createElement("div");
    col.className = "daycol-bg";
    col.style.left = "calc((100% ) * "+(d/5)+")";
    col.style.width = "calc((100% ) * "+(1/5)+")";
    if(d===todayCol) col.style.background="rgba(47,111,106,.10)";
    grid.appendChild(col);
  }

  const used = new Set();
  const hoyIso = todayIso();
  items.forEach(({s,past,skip,tema,title,detail,date})=>{
    used.add(s.c);
    const course = courses[s.c];
    const block = document.createElement("div");
    block.className = "block"+(skip ? " skipped" : "");
    if(skip){ block.style.color = course.color; }
    else { block.style.background = course.color; }
    block.style.top = ((s.s-HOUR_START)*HOUR_PX)+2+"px";
    block.style.height = ((s.e-s.s)*HOUR_PX)-4+"px";
    block.style.left = "calc((100% ) * "+(s.d/5)+" + 3px)";
    block.style.width = "calc((100% ) * "+(1/5)+" - 6px)";
    if(selectedCourse){
      if(s.c!==selectedCourse) block.style.opacity = "0.15";
    } else if(past){
      block.style.opacity = skip ? "0.4" : "0.12";
    }

    const horas = fmtHour(s.s)+"\u2013"+fmtHour(s.e);
    if(skip){
      block.innerHTML = "<b>"+s.c+". "+course.name+"</b>"+
        "<span class='st'>"+(date===hoyIso ? "Hoy no se cursa" : "No se cursa este d\u00eda")+"</span>"+
        "<span class='t'>"+horas+"</span>";
    } else if(date && (title || detail)){
      const parts = PARTS[s.c] && PARTS[s.c][s.d];
      block.innerHTML = "<b>"+s.c+". "+course.name+"</b>"+
        (tema ? "<span class='tm'>"+tema+"</span>" : "")+
        (title ? "<span class='ti'>"+title+"</span>" : "")+
        (detail ? "<span class='de'>"+detail+"</span>" : "")+
        (parts
          ? parts.map(x=>"<span class='pt'>"+fmtHour(x[0])+"\u2013"+fmtHour(x[1])+" "+x[2]+" \u00b7 "+x[3]+"</span>").join("")
          : "<span class='t'>"+horas+"</span>");
    } else {
      const dateRange = s.f===s.t ? fmtDateLong(s.f) : fmtDateLong(s.f)+" \u2192 "+fmtDateLong(s.t);
      block.innerHTML = "<b>"+s.c+". "+course.name+"</b>"+
        (tema ? "<span class='tm'>"+tema+"</span>" : "")+
        "<span class='dr'>"+dateRange+"</span>"+
        "<span class='t'>"+horas+"</span>";
    }
    grid.appendChild(block);
  });

  gridOuter.appendChild(grid);
  panel.appendChild(gridOuter);
  return used;
}

function drawLegend(used, title){
  const legend = document.createElement("div");
  legend.className = "legend";
  const lt = document.createElement("div");
  lt.className = "legend-title";
  lt.textContent = title;
  legend.appendChild(lt);
  const lg = document.createElement("div");
  lg.className = "legend-grid";
  Array.from(used).sort((a,b)=>a-b).forEach(cid=>{
    const course = courses[cid];
    const item = document.createElement("div");
    item.className = "legend-item";
    item.style.cursor = "pointer";
    if(selectedCourse){
      if(cid!==selectedCourse) item.style.opacity = "0.4";
    } else if(isFinished(cid)){
      item.style.opacity = "0.4";
    }
    item.addEventListener("click",()=>{
      selectedCourse = (selectedCourse===cid) ? null : cid;
      rerender();
    });
    item.innerHTML = "<span class='swatch' style='background:"+course.color+"'></span>"+
      "<span><span class='name'>"+cid+". "+course.name+"</span>"+
      (isFinished(cid) ? "<span class='done-tag'>Terminada</span>" : "")+
      "<span class='meta'>"+course.prof+"</span></span>";
    lg.appendChild(item);
  });
  legend.appendChild(lg);
  panel.appendChild(legend);
}

function renderMonth(key){
  const {start,end} = monthBounds(key);
  const active = sessions.filter(s=>overlaps(s,start,end));
  const hoyD = new Date();
  const claveHoyMes = hoyD.getFullYear()+"-"+String(hoyD.getMonth()+1).padStart(2,"0");
  const diaHoy = (hoyD.getDay()+6)%7;

  panel.innerHTML = "";

  if(active.length===0){
    panel.innerHTML = '<div class="empty">Sin clases programadas este mes.</div>';
    return;
  }

  const items = active.map(s=>({s, past:isPast(s.t)}));
  const used = drawGrid(items, DAY_NAMES, key===claveHoyMes ? diaHoy : -1);
  drawLegend(used, "Asignaturas activas este mes");
}

function renderWeek(){
  if(!weekStart) weekStart = defaultWeek();
  const dates = [0,1,2,3,4].map(i=>addDaysIso(weekStart,i));
  const hoy = todayIso();

  const items = [];
  sessions.forEach(s=>{
    const date = dates[s.d];
    if(s.f<=date && date<=s.t) items.push(Object.assign({s, date, past: date<hoy}, classInfo(s,date)));
  });

  panel.innerHTML = "";

  const nav = document.createElement("div");
  nav.className = "weeknav";
  const prev = document.createElement("button");
  prev.textContent = "\u2190";
  prev.title = "Semana anterior";
  prev.disabled = weekStart<=firstMonday;
  prev.addEventListener("click",()=>{ weekStart = addDaysIso(weekStart,-7); selectedCourse=null; renderWeek(); });
  const label = document.createElement("div");
  label.className = "wk-label";
  label.textContent = fmtDateLong(dates[0])+" \u2013 "+fmtDateLong(dates[4])+" "+dates[4].slice(0,4);
  const next = document.createElement("button");
  next.textContent = "\u2192";
  next.title = "Semana siguiente";
  next.disabled = weekStart>=lastMonday;
  next.addEventListener("click",()=>{ weekStart = addDaysIso(weekStart,7); selectedCourse=null; renderWeek(); });
  const hoyBtn = document.createElement("button");
  hoyBtn.textContent = "Hoy";
  hoyBtn.addEventListener("click",()=>{ weekStart = defaultWeek(); selectedCourse=null; renderWeek(); });
  nav.appendChild(prev); nav.appendChild(label); nav.appendChild(next); nav.appendChild(hoyBtn);
  panel.appendChild(nav);

  if(items.length===0){
    const emp = document.createElement("div");
    emp.className = "empty";
    emp.textContent = "Sin clases esta semana.";
    panel.appendChild(emp);
    return;
  }

  const labels = dates.map((d,i)=>DAY_NAMES[i]+"<small>"+fmtDateLong(d)+"</small>");
  const used = drawGrid(items, labels, dates.indexOf(hoy));
  drawLegend(used, "Asignaturas esta semana");
}

/* ---------- Hoy / Próxima clase ---------- */
const DAY_FULL = ["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
function madridNow(){
  const parts = new Intl.DateTimeFormat("en-GB",{
    timeZone:"Europe/Madrid",year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",hourCycle:"h23"
  }).formatToParts(new Date());
  const g = k => parts.find(p=>p.type===k).value;
  return {iso:g("year")+"-"+g("month")+"-"+g("day"), hour:Number(g("hour"))+Number(g("minute"))/60};
}
function addDaysIso(iso,n){
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10);
}
function dowOfIso(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return (new Date(Date.UTC(y,m-1,d)).getUTCDay()+6)%7;
}
function sessionsOn(date, minEnd){
  const dw = dowOfIso(date);
  return sessions
    .filter(s=>s.d===dw && s.f<=date && date<=s.t && s.e>minEnd)
    .map(s=>Object.assign({s,date}, classInfo(s,date)))
    .sort((a,b)=>a.s.s-b.s.s);
}
function findNext(){
  const now = madridNow();
  const today = sessionsOn(now.iso, now.hour);
  let next = null;
  if(!today.some(x=>!x.skip)){
    for(let i=1;i<400;i++){
      const date = addDaysIso(now.iso,i);
      const list = sessionsOn(date,-1).filter(x=>!x.skip);
      if(list.length){ next = {i,date,list}; break; }
    }
  }
  return {now,today,next};
}
function nbLines(list, nowHour, isToday){
  return list.map(x=>{
    const c = courses[x.s.c];
    const live = isToday && !x.skip && x.s.s<=nowHour;
    return "<div class='nb-line"+(x.skip ? " nb-muted" : "")+"'><span class='nb-sw' style='background:"+c.color+"'></span>"+
      "<b>"+fmtHour(x.s.s)+"\u2013"+fmtHour(x.s.e)+"</b> "+c.name+
      (x.tema ? " \u00b7 "+x.tema : "")+
      (x.title ? " \u00b7 "+x.title : "")+
      (x.skip ? " <span class='nb-skip'>Sin clase hoy</span>" : "")+
      (live ? " <span class='nb-live'>en curso</span>" : "")+"</div>";
  }).join("");
}
function renderNext(){
  const box = document.getElementById("nextbox");
  const r = findNext();
  let html = "";
  if(r.today.length) html += "<div class='nb-title'>Hoy</div>"+nbLines(r.today, r.now.hour, true);
  if(r.next){
    const fecha = DAY_FULL[dowOfIso(r.next.date)]+" "+fmtDateLong(r.next.date);
    const title = r.next.i===1 ? "Ma\u00f1ana \u00b7 "+fecha : "Pr\u00f3xima clase \u00b7 "+fecha;
    html += "<div class='nb-title"+(r.today.length ? " nb-gap" : "")+"'>"+title+"</div>"+nbLines(r.next.list, r.now.hour, false);
  }
  if(!html) html = "<div class='nb-title'>Pr\u00f3xima clase</div><div class='nb-line'>No quedan clases programadas.</div>";
  box.innerHTML = html;
}

// Marca el botón de zona horaria guardado
document.getElementById("btn-pen").classList.toggle("active", tzOffset===0);
document.getElementById("btn-can").classList.toggle("active", tzOffset===1);

renderNext();
setInterval(renderNext, 60000);

// Abre el mes actual (o el más cercano dentro del curso)
const hoy = new Date();
const claveHoy = hoy.getFullYear() + "-" + String(hoy.getMonth() + 1).padStart(2, "0");
const claves = months.map(m => m.key);
selectMonth(
  claves.includes(claveHoy) ? claveHoy
  : claveHoy < claves[0] ? claves[0]
  : claves[claves.length - 1]
);
setView(viewMode);
</script>
